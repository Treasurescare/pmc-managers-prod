// Self-contained plugin mappings for standalone Android builds
include ':capacitor-android'
project(':capacitor-android').projectDir = new File('./capacitor-plugins/capacitor-android')

include ':aparajita-capacitor-biometric-auth'
project(':aparajita-capacitor-biometric-auth').projectDir = new File('./capacitor-plugins/aparajita-capacitor-biometric-auth')

include ':capacitor-camera'
