# Optional convenience for local dev. EB's Docker platform only reads the
# top-level Dockerfile — it ignores docker-compose. Keep this file for
# running the image locally against your own Mongo.
version: "3.8"

services:
  backend:
    build: .
    container_name: pmc-backend
    ports:
      - "8001:8001"
    environment:
      MONGO_URL: "${MONGO_URL}"
      DB_NAME: "${DB_NAME:-pmc_v2}"
      PORT: "8001"
      STRIPE_API_KEY: "${STRIPE_API_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      JWT_SECRET: "${JWT_SECRET:-dev-only-change-me}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      LOCAL_DEV: "0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
