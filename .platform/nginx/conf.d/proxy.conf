# v46d — Elastic Beanstalk nginx proxy override.
# Symptom this fixes: HTTP 413 "Request Entity Too Large" from nginx/1.30.4
# on POST /api/v1/tender-pro/dpr/analyze-json (KMT DPR is 1.36 MB → 1.83 MB
# base64 JSON payload → EB default 1 MB body limit rejects it).
#
# EB "Docker running on 64bit Amazon Linux 2" auto-loads any *.conf files
# under .platform/nginx/conf.d/ into the front-facing nginx server block.

client_max_body_size 25M;
