# v46l — Elastic Beanstalk nginx proxy override.
# Cap raised to 200 MB so /dpr/analyze-async can accept ≤100 MB PDFs
# base64-encoded (~140 MB JSON payload). Small margin for headers.
client_max_body_size 200M;
client_body_timeout 300s;
send_timeout 300s;
keepalive_timeout 300s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
