version: 1.0
runtime: python311

build:
  commands:
    build:
      - pip install --upgrade pip
      - pip install -r backend/requirements.txt

run:
  runtime-version: 3.11
  command: cd backend && uvicorn server:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
    env: PORT
  env:
    - name: PYTHONUNBUFFERED
      value: "1"
